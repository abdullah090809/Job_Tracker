      #     if [ -z "$HF_TOKEN" ]; then
      #       echo "HF_TOKEN not set; aborting push."
      #       exit 1
      #     fi
      #     git config --global user.email "ci@github.com"
      #     git config --global user.name "GitHub Actions"
      #     git remote add space "https://abdullah090809:${HF_TOKEN}@huggingface.co/spaces/abdullah090809/Job_Tracker_API.git" || \
      #       git remote set-url space "https://abdullah090809:${HF_TOKEN}@huggingface.co/spaces/abdullah090809/Job_Tracker_API.git"
      #     git push space master:main --force
